name: Windows installer

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Set up stable Rust with MSVC target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Check Rust build
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Require updater signing key for release tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Set the TAURI_SIGNING_PRIVATE_KEY GitHub Actions secret before publishing a release tag."
          }
          $packageVersion = (Get-Content "package.json" -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path "src-tauri/Cargo.toml" -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion" -or $packageVersion -ne $tauriVersion -or $tauriVersion -ne $cargoVersion) {
            throw "Release tag, package.json, Cargo.toml, and Tauri app versions must match."
          }

      - name: Build application binaries
        run: npm run tauri -- build --no-bundle

      - name: Sign application executable when certificate is configured
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64)) {
            Write-Host "No Authenticode certificate configured; executable will remain unsigned."
            return
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PASSWORD)) {
            throw "WINDOWS_SIGNING_PASSWORD is required when a signing certificate is configured."
          }
          $certificate = Join-Path $env:RUNNER_TEMP "sc-dlp-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
          if (-not $signtool) { throw "Windows SDK signtool.exe was not found." }
          & $signtool sign /f $certificate /p $env:WINDOWS_SIGNING_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 src-tauri/target/release/soundcloud-downloader.exe
          if ($LASTEXITCODE -ne 0) { throw "Signing the application executable failed." }
          & $signtool verify /pa /v src-tauri/target/release/soundcloud-downloader.exe
          if ($LASTEXITCODE -ne 0) { throw "Application executable signature verification failed." }
          Remove-Item $certificate -Force

      - name: Build NSIS installer for CI
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run tauri:build

      - name: Build signed NSIS updater package
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --config src-tauri/tauri.release.conf.json

      - name: Give installer a stable filename
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe")
          if ($installers.Count -ne 1) {
            throw "Expected one NSIS installer, found $($installers.Count)."
          }
          Copy-Item $installers[0].FullName "SC-dlp_Setup.exe"
          if ("${{ startsWith(github.ref, 'refs/tags/v') }}" -eq "True") {
            $signature = "$($installers[0].FullName).sig"
            if (-not (Test-Path $signature)) { throw "Tauri updater signature was not generated." }
            Copy-Item $signature "SC-dlp_Setup.exe.sig"
          }

      - name: Sign installer when certificate is configured
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64)) {
            Write-Host "No Authenticode certificate configured; installer will remain unsigned."
            return
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PASSWORD)) {
            throw "WINDOWS_SIGNING_PASSWORD is required when a signing certificate is configured."
          }
          $certificate = Join-Path $env:RUNNER_TEMP "sc-dlp-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
          if (-not $signtool) { throw "Windows SDK signtool.exe was not found." }
          & $signtool sign /f $certificate /p $env:WINDOWS_SIGNING_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 SC-dlp_Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "Signing the installer failed." }
          & $signtool verify /pa /v SC-dlp_Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "Installer signature verification failed." }
          Remove-Item $certificate -Force

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "SC-dlp_Setup.exe" -Algorithm SHA256).Hash
          "$hash  SC-dlp_Setup.exe" | Set-Content -Encoding ascii "SC-dlp_Setup.exe.sha256"

      - name: Sign final updater package and create update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          $appVersion = (Get-Content "package.json" -Raw | ConvertFrom-Json).version
          npm run tauri -- signer sign --app-version $appVersion SC-dlp_Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "Signing the final updater package failed." }
          $signature = (Get-Content "SC-dlp_Setup.exe.sig" -Raw).Trim()
          $manifest = @{
            version = $appVersion
            notes = "SC-dlp $appVersion"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = "https://github.com/KushKim/SC-dlp/releases/download/$($env:GITHUB_REF_NAME)/SC-dlp_Setup.exe"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM "latest.json"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SC-dlp-Setup
          path: |
            SC-dlp_Setup.exe
            SC-dlp_Setup.exe.sha256
          if-no-files-found: error

      - name: Upload updater manifest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: SC-dlp-Updater
          path: |
            SC-dlp_Setup.exe.sig
            latest.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: SC-dlp-Setup
          path: release

      - name: Download updater artifact
        uses: actions/download-artifact@v4
        with:
          name: SC-dlp-Updater
          path: release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/SC-dlp_Setup.exe
            release/SC-dlp_Setup.exe.sha256
            release/SC-dlp_Setup.exe.sig
            release/latest.json
          fail_on_unmatched_files: true
